name: Compilar APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Preparar la firma
        env:
          NAVI_KEYSTORE_B64: ${{ secrets.NAVI_KEYSTORE_B64 }}
        run: echo "$NAVI_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/navi.jks"

      - name: Compilar
        env:
          NAVI_KEYSTORE: ${{ runner.temp }}/navi.jks
          NAVI_KEYSTORE_PASS: ${{ secrets.NAVI_KEYSTORE_PASS }}
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk navi-tv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: navi-tv
          path: navi-tv.apk

      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" navi-tv.apk --title "NAVI TV $GITHUB_REF_NAME" --generate-notes --prerelease
